[project]
name = "pyflypro2"
version = "0.1.0"
description = "Консольное приложение для поиска самолётов через OpenSky и Nominatim"
authors = [
    {name = "Ирина Коваленко", email = "kiris-83@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.0,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-cov (>=5.0,<6.0)",
    "requests-mock (>=1.12.1,<2.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
